<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Absen Harian</title>
  <style>
    :root {
      --accent-datang: #059669;
      --accent-pulang: #2563eb;
      --radius: 16px;
      --ink: #18181b;
      --muted: #52525b;
      --line: #e4e4e7;
      --bg: #fafafa;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    header.top { text-align: center; margin-bottom: 1.5rem; }
    header.top h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
    header.top p { margin: 0.15rem 0; color: var(--muted); font-size: 0.95rem; }
    #clock-wib, #countdown { display: inline-block; max-width: 100%; }
    #clock-wib { font-weight: 700; color: var(--ink); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 768px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-top: 6px solid var(--accent);
      border-radius: var(--radius);
      padding: 1.25rem;
    }
    .card.datang { --accent: var(--accent-datang); --btn-bg: #047857; }
    .card.pulang { --accent: var(--accent-pulang); --btn-bg: #1d4ed8; }
    .card h2 { margin: 0 0 0.25rem; font-size: 1.2rem; }
    .card .sub { margin: 0 0 1rem; color: var(--muted); font-size: 0.9rem; }
    .qr-box {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 252px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      background: #fff;
    }
    .qr-box img, .qr-box canvas, .qr-box table { border-radius: 8px; }
    .timestamp { color: var(--muted); font-size: 0.85rem; }
    .error { display: none; border: 1px solid #fecaca; background: #fef2f2; color: #991b1b; border-radius: var(--radius); padding: 0.75rem; margin-top: 0.75rem; }
    .error.show { display: block; }
    .btn {
      margin-top: 0.5rem;
      border: 0;
      border-radius: var(--radius);
      padding: 0.6rem 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: var(--btn-bg, var(--accent));
      cursor: pointer;
    }
    .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    .skeleton {
      width: 220px;
      height: 220px;
      border-radius: 8px;
      background: linear-gradient(90deg, #f4f4f5 25%, #e4e4e7 50%, #f4f4f5 75%);
      background-size: 200% 100%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      to { background-position: -200% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }
    html, body { overflow-x: hidden; }
    .qr-box img, .qr-box canvas, .qr-box table { max-width: 100%; height: auto; }
    header.top p { overflow-wrap: break-word; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>QR Absen Harian</h1>
      <p>Jam WIB saat ini: <span id="clock-wib">memuat...</span></p>
      <p>QR baru dalam: <span id="countdown">--:--:--</span></p>
    </header>
    <main class="grid">
      <section class="card datang" aria-labelledby="title-datang">
        <h2 id="title-datang">QR Datang</h2>
        <p class="sub">Pindai untuk absen datang hari ini</p>
        <div class="qr-box" id="qr-datang" role="img" aria-label="QR absen datang hari ini">
          <div class="skeleton" aria-hidden="true"></div>
        </div>
        <p class="timestamp" id="time-datang"></p>
        <div class="error" id="err-datang">
          <span>Gagal memuat QR Datang. Periksa koneksi lalu coba lagi.</span><br />
          <button class="btn" id="btn-datang" type="button">Coba lagi</button>
        </div>
      </section>
      <section class="card pulang" aria-labelledby="title-pulang">
        <h2 id="title-pulang">QR Pulang</h2>
        <p class="sub">Pindai untuk absen pulang hari ini</p>
        <div class="qr-box" id="qr-pulang" role="img" aria-label="QR absen pulang hari ini">
          <div class="skeleton" aria-hidden="true"></div>
        </div>
        <p class="timestamp" id="time-pulang"></p>
        <div class="error" id="err-pulang">
          <span>Gagal memuat QR Pulang. Periksa koneksi lalu coba lagi.</span><br />
          <button class="btn" id="btn-pulang" type="button">Coba lagi</button>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    var TZ = "Asia/Jakarta";
    var lastWibDate = "";

    function wibParts(d) {
      var parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      }).formatToParts(d || new Date());
      var o = {};
      parts.forEach(function (p) { o[p.type] = p.value; });
      return o;
    }

    function wibDateStr() {
      var p = wibParts();
      return p.year + "-" + p.month + "-" + p.day;
    }

    function msUntilWibMidnight() {
      var p = wibParts();
      var midnightUtc = Date.UTC(+p.year, +p.month - 1, +p.day + 1, 0, 0, 0) - 7 * 3600 * 1000;
      return Math.max(0, midnightUtc - Date.now());
    }

    function renderCard(kind, payload) {
      var box = document.getElementById("qr-" + kind);
      box.innerHTML = "";
      var text = JSON.stringify(payload);
      if (typeof QRCode === "undefined") {
        box.textContent = "Pustaka QR gagal dimuat (CDN diblokir). Data JSON tetap tampil di bawah.";
      } else {
        new QRCode(box, { text: text, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
      }
      document.getElementById("time-" + kind).textContent = "Diperbarui: " + payload.createdAt + " WIB";
      document.getElementById("err-" + kind).classList.remove("show");
    }

    function failCard(kind) {
      document.getElementById("err-" + kind).classList.add("show");
    }

    function loadCard(kind) {
      return fetch("/api/qr-" + kind).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).then(function (payload) {
        renderCard(kind, payload);
      }).catch(function () {
        failCard(kind);
      });
    }

    function loadBoth() {
      lastWibDate = wibDateStr();
      return Promise.all([loadCard("datang"), loadCard("pulang")]);
    }

    function scheduleMidnightRefetch() {
      setTimeout(function () {
        loadBoth().then(scheduleMidnightRefetch);
      }, msUntilWibMidnight() + 1000);
    }

    function tickClock() {
      var now = new Date();
      document.getElementById("clock-wib").textContent = new Intl.DateTimeFormat("id-ID", {
        timeZone: TZ, weekday: "long", year: "numeric", month: "long",
        day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit"
      }).format(now);
      var ms = msUntilWibMidnight();
      var s = Math.floor(ms / 1000);
      var hh = String(Math.floor(s / 3600)).padStart(2, "0");
      var mm = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
      var ss = String(s % 60).padStart(2, "0");
      document.getElementById("countdown").textContent = hh + ":" + mm + ":" + ss;
      if (wibDateStr() !== lastWibDate && lastWibDate !== "") {
        loadBoth();
      }
    }

    document.getElementById("btn-datang").addEventListener("click", function () { loadCard("datang"); });
    document.getElementById("btn-pulang").addEventListener("click", function () { loadCard("pulang"); });

    loadBoth().then(scheduleMidnightRefetch);
    setInterval(tickClock, 1000);
    setInterval(loadBoth, 30000);
    tickClock();
  </script>
</body>
</html>
